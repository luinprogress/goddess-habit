<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>女神養成所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄手機優先。今天（儀表板＋習慣清單）／紀錄／積分（總覽、明細、兌換）／目標／設定，底部五個分頁 */
:root {
  --primary: #527568;
  --sage: #A9C6B5;
  --bg: #FAF8F2;
  --text: #37352F;
  --success: #E8B9AA;
  --blue: #C7DCE4;
  --border: #EAE6DE;
  --card: #FFFEFB;
  --soft: #6A675E;
  --mint: #E9F1EC;
  --peach-tint: #FBF0EB;
  --warn: #9A4B3A;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap-row { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--soft); }
.small { font-size: 13px; }
.b { font-weight: 700; }

.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--primary); font-weight: 700; }
.top h1 { font-size: 26px; margin-top: 2px; }
.chip { flex: none; background: var(--mint); color: var(--primary); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip.peach { background: var(--peach-tint); color: #8A5A4B; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 16px; }
.card h2 { font-size: 17px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.hero { display: flex; gap: 14px; align-items: center; background: var(--mint); border-color: transparent; }
.hero svg.mascot { flex: none; width: 88px; height: 88px; }
.hero .msg { font-size: 17px; font-weight: 500; line-height: 1.55; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--primary); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .label { font-size: 13px; color: var(--soft); }
.stat .big { font-size: 28px; font-weight: 700; line-height: 1.15; color: var(--primary); font-variant-numeric: tabular-nums; }
.stat .big small { font-size: 14px; font-weight: 500; color: var(--soft); margin-left: 2px; }
.bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--sage); border-radius: 99px; }
.bar > i.full { background: var(--success); }

.levelcard { display: flex; align-items: center; gap: 14px; }
.lvbadge { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--success); display: grid; place-items: center; font-weight: 700; font-size: 18px; color: var(--text); border: 4px solid var(--peach-tint); }
.lvname { font-size: 18px; font-weight: 700; }

.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datenav .date { font-weight: 700; text-align: center; flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; cursor: pointer; flex: none; font-size: 20px; line-height: 1; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; }

.habits { display: flex; flex-direction: column; gap: 10px; }
.habit { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; min-height: 60px; padding: 10px 14px 10px 10px; background: var(--card); border: 1.5px solid var(--border); border-radius: 18px; transition: background .15s, border-color .15s; }
.habit:focus-visible, .tab:focus-visible, .iconbtn:focus-visible, .link-btn:focus-visible, .btn:focus-visible, .cal-cell:focus-visible, .seg button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.habit .ico, .ico { flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--mint); display: grid; place-items: center; }
.habit .ico svg, .ico svg { width: 22px; height: 22px; }
.ico svg, .tab svg, .bico svg { fill: none; stroke: var(--primary); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.habit .name { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.habit .desc { display: block; font-size: 13px; color: var(--soft); font-weight: 400; }
.habit .tag { font-size: 12px; font-weight: 700; color: #8A5A4B; background: var(--peach-tint); border-radius: 99px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }
.habit .check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--sage); display: grid; place-items: center; background: transparent; }
.habit .check svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.habit.done { background: var(--peach-tint); border-color: var(--success); }
.habit.done .check { background: var(--success); border-color: var(--success); }
.habit.done .check svg { opacity: 1; }
.habit.pop .check { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .habit.pop .check { animation: none; } * { transition: none !important; animation: none !important; } }

.note { background: var(--blue); border-color: transparent; font-size: 14px; }
.note.warn { background: var(--peach-tint); color: #6B3F31; }
.empty { text-align: center; padding: 18px 8px; color: var(--soft); }

.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--soft); }
.dot { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; display: grid; place-items: center; }
.dot.on { background: var(--sage); border-color: var(--sage); }
.dot.workout { background: var(--success); border-color: var(--success); }
.dot svg { width: 55%; fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.dot.today { box-shadow: 0 0 0 3px var(--blue); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .h { text-align: center; font-size: 12px; color: var(--soft); }
.cal-cell { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; padding: 0; font-variant-numeric: tabular-nums; }
.cal-cell.l1 { background: #EDF3EF; }
.cal-cell.l2 { background: #D5E4DB; }
.cal-cell.l3 { background: var(--sage); }
.cal-cell.empty-cell { border: 0; background: transparent; cursor: default; }
.cal-cell.future { opacity: .4; cursor: default; }
.cal-cell.today { box-shadow: 0 0 0 2px var(--blue); }
.cal-cell.sel { border-color: var(--primary); border-width: 2px; }
.cal-cell .wk { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
.cal-cell .wk.none { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--soft); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--border); }

label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--soft); min-width: 0; }
input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; min-width: 0; background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 16px; color: var(--text); }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--blue); border-color: var(--primary); }
textarea { resize: vertical; min-height: 84px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.btn { border: 0; background: var(--primary); color: #fff; border-radius: 14px; padding: 10px 16px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--sage); }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--success); }
.btn.danger.armed, .btn.armed { background: var(--success); color: var(--text); border-color: var(--success); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper .v { font-size: 26px; font-weight: 700; min-width: 2ch; text-align: center; color: var(--primary); font-variant-numeric: tabular-nums; }

.edit { border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
.edit.off { opacity: .65; }
.edit .line { display: flex; gap: 8px; align-items: center; }
.edit select { width: auto; flex: none; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
.checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--primary); }

.result { border-radius: 16px; padding: 14px; background: var(--mint); }
.result.peach { background: var(--peach-tint); }
.result .k { font-size: 13px; color: var(--soft); }
.result .v { font-size: 24px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.result.peach .v { color: #8A5A4B; }
.timeline { position: relative; height: 10px; background: var(--border); border-radius: 99px; margin: 10px 0 6px; }
.timeline > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sage); border-radius: 99px; }
.ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); gap: 6px; }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--mint); padding: 4px; border-radius: 14px; }
.seg button { border: 0; background: transparent; border-radius: 11px; padding: 8px 4px; font-weight: 500; color: var(--soft); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--primary); font-weight: 700; }

.ledger { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.lrow:first-child { border-top: 0; }
.lrow .pts { flex: none; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.lrow.rev .lt { text-decoration: line-through; color: var(--soft); }
.lrow.rev .pts { color: var(--soft); text-decoration: line-through; }
.lrow .ld { font-size: 12px; color: var(--soft); }
.tagpill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--mint); color: var(--primary); white-space: nowrap; }
.tagpill.bonus { background: var(--peach-tint); color: #8A5A4B; }
.tagpill.off { background: var(--border); color: var(--soft); }

.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; color: var(--soft); }
.bico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--border); opacity: .6; }
.bico svg { width: 26px; height: 26px; stroke: var(--soft); }
.badge.on { color: var(--text); font-weight: 500; }
.badge.on .bico { background: var(--success); opacity: 1; }
.badge.on .bico svg { stroke: var(--text); }

.sumrow { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.sumrow .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kv > div { background: var(--mint); border-radius: 14px; padding: 10px 12px; }
.kv .k { font-size: 12px; color: var(--soft); }
.kv .v { font-size: 22px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.rules { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(250, 248, 242, .96); border-top: 1px solid var(--border); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.tab { border: 0; background: transparent; border-radius: 14px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--soft); cursor: pointer; }
.tab svg { width: 22px; height: 22px; stroke: var(--soft); }
.tab.on { background: var(--mint); color: var(--primary); font-weight: 700; }
.tab.on svg { stroke: var(--primary); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.toast[hidden] { display: none; }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(55, 53, 47, .45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.modal { background: var(--bg); border-radius: 24px; padding: 22px 18px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: 100%; overflow: auto; position: relative; }
.modal h2 { font-size: 20px; }
.modal ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.modal .mascot { width: 96px; height: 96px; align-self: center; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 24px; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: fall 2.4s ease-in infinite; }
@keyframes fall { to { transform: translateY(520px) rotate(360deg); opacity: .2; } }

.icobtn { position: relative; flex: none; width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--mint); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icobtn svg, .icopick svg { fill: none; stroke: var(--primary); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icobtn svg { width: 24px; height: 24px; }
.icobtn::after { content: ""; position: absolute; right: 4px; bottom: 4px; border: 4px solid transparent; border-top-color: var(--soft); border-bottom: 0; }
.icogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; padding: 8px; background: var(--mint); border-radius: 14px; }
.icopick { width: 100%; max-width: 52px; aspect-ratio: 1; border-radius: 12px; border: 1.5px solid transparent; background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.icopick svg { width: 22px; height: 22px; }
.icopick.on { border-color: var(--primary); background: var(--peach-tint); }
.icobtn:focus-visible, .icopick:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (max-width: 380px) {
  .top h1 { font-size: 23px; }
  .stat .big { font-size: 24px; }
  .hero svg.mascot { width: 72px; height: 72px; }
  .badges { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="wrap"><div id="view"></div></div>
<nav class="tabs" aria-label="主要分頁"><div class="tabs-in" id="tabs"></div></nav>
<div id="modal"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * 店內活動設定（會員版）
   * 這一段由「女神養成所後台」產生，更新時整段貼上取代即可，其他程式碼不用動。
   * 會員無法在 App 內修改這些設定。更新後，會員下次開啟時會自動套用：
   *  - 積分規則：從隔天起生效（或 rulesEffectiveFrom 指定的較晚日期），不回溯
   *  - 已經拿到的積分、活動獎勵、兌換紀錄完全不受影響
   *  - 每次更新，configVersion 要比上一版大（後台會自動處理）
   * ===================================================================== */
  /*__STORE_BEGIN__*/
  var STORE = {
    configVersion: 1,
    rulesEffectiveFrom: '',
    period: { start: '2026-12-01', end: '2027-02-28' },
    ticketCost: 30,
    levels: [
      { lv: 1, name: '初心女神', min: 0 },
      { lv: 2, name: '習慣女神', min: 50 },
      { lv: 3, name: '自律女神', min: 120 },
      { lv: 4, name: '力量女神', min: 200 },
      { lv: 5, name: '閃耀女神', min: 300 }
    ],
    rules: {
      perHabit: 1,
      allDayBonus: 2,
      weekWorkout: { days: 3, points: 5 },
      weekConsistent: { days: 5, perDayMin: 3, points: 3 },
      weekMission: { points: 5, missions: [
        { title: '本週 5 天蔬菜吃夠', habitId: 'h-veg', days: 5 },
        { title: '本週 5 天喝足水', habitId: 'h-water', days: 5 },
        { title: '本週 5 天睡滿 7 小時', habitId: 'h-sleep', days: 5 },
        { title: '本週 5 天蛋白質吃夠', habitId: 'h-protein', days: 5 }
      ] },
      streak: { len: 7, perDayMin: 3, points: 5 }
    },
    events: [
      { id: 'evt-xmas', name: '聖誕節健康日', desc: '12/25 完成運動，送給自己的聖誕禮物。', icon: 'tree', start: '2026-12-25', end: '2026-12-25', kind: 'habit_once', habitId: 'h-train', target: 1, points: 3, enabled: true },
      { id: 'evt-newyear', name: '元旦連續運動', desc: '1/1–1/3 連續運動 3 天，開年第一份力量。', icon: 'flame', start: '2027-01-01', end: '2027-01-03', kind: 'workout_streak', habitId: 'h-train', target: 3, points: 5, enabled: true },
      { id: 'evt-cny', name: '農曆新年健康任務', desc: '2/5–2/11 有 3 天全部完成，過年也輕鬆照顧自己。', icon: 'gift', start: '2027-02-05', end: '2027-02-11', kind: 'full_days', habitId: 'h-train', target: 3, points: 5, enabled: true },
      { id: 'evt-boost', name: '運動次數加碼（範例）', desc: '1/15–1/31 累計運動 8 天加碼。', icon: 'trophy', start: '2027-01-15', end: '2027-01-31', kind: 'workout_days', habitId: 'h-train', target: 8, points: 5, enabled: false }
    ]
  };
  /*__STORE_END__*/

  var CONFIG = Object.assign({
    storageKey: 'goddess-habit-v1',          // 不要改，改了會讀不到舊資料
    schema: 2,                                // 資料結構版本
    habits: [                                 // 新使用者的 5 項核心習慣（會員可自行調整名稱與圖示）
      { id: 'h-train', name: '完成今天的運動', desc: '重訓或有氧，30 分鐘以上', icon: 'dumbbell', workout: true, active: true },
      { id: 'h-protein', name: '蛋白質吃夠', desc: '每餐一個手掌大小', icon: 'bowl', workout: false, active: true },
      { id: 'h-water', name: '喝水 2000 cc', desc: '分次喝，睡前不用硬灌', icon: 'drop', workout: false, active: true },
      { id: 'h-veg', name: '每餐都有蔬菜', desc: '每餐一個拳頭的量', icon: 'leaf', workout: false, active: true },
      { id: 'h-sleep', name: '睡滿 7 小時', desc: '睡得好，肌肉才長得好', icon: 'moon', workout: false, active: true }
    ]
  }, STORE);
  var KEY = CONFIG.storageKey;

    S.ticketCost = STORE.ticketCost;
    S.levels = normLevels(STORE.levels) || S.levels;
    S.events = STORE.events.filter(function (e) { return e && e.id; }).map(normEvent);
    if (periodChanged) {
      var ledgerBefore = clone(S.ledger);
      reconcileAll();
      if (earnedTotal() < spentTotal()) S.ledger = ledgerBefore;
    }
    S.maxLevelCelebrated = Math.max(S.maxLevelCelebrated, levelOf(earnedTotal()).lv);
    S.configVersion = STORE.configVersion;
    return true;
  }

  /* ---------- 啟動 ---------- */
  var now = new Date();
  U.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  var h0 = location.hash.replace('#', '');
  if (TAB_IDS.indexOf(h0) >= 0) U.tab = h0;
  if (migratedFromV1) { reconcileAll(); }
  var configUpdated = applyConfigIfNeeded();
  if (!S.onboarded) U.modal = { type: 'onboard' };
  if (migratedFromV1 || !S.onboarded || configUpdated) save();
  render();
  if (configUpdated && loggedDays() > 0) toast('活動設定已更新（第 ' + S.configVersion + ' 版），已拿到的積分不受影響');
})();
</script>
</body>
</html>
