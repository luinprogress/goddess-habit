<style>

}

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px; }

.small { font-size: 13px; }
.b { font-weight: 700; }

.top h1 { font-size: 26px; margin-top: 2px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 16px; }
.card h2 { font-size: 17px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.note { background: var(--blue); border-color: transparent; font-size: 14px; }
.note.warn { background: var(--peach-tint); color: #6B3F31; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--soft); min-width: 0; }
input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; min-width: 0; background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 16px; color: var(--text); }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.btn { border: 0; background: var(--primary); color: #fff; border-radius: 14px; padding: 10px 16px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--sage); }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--success); }
.btn.armed { background: var(--success); color: var(--text); border-color: var(--success); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 12px; }
.edit { border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
.edit.off { opacity: .7; }
.line { display: flex; gap: 8px; align-items: center; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
.checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--primary); }
.tagpill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--mint); color: var(--primary); white-space: nowrap; }
.rules { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.errs { margin: 0; padding-left: 20px; font-size: 14px; color: var(--warn); display: flex; flex-direction: column; gap: 4px; }
.icobtn { position: relative; flex: none; width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--mint); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icobtn svg, .icopick svg { fill: none; stroke: var(--primary); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icobtn svg { width: 24px; height: 24px; }
.icobtn::after { content: ""; position: absolute; right: 4px; bottom: 4px; border: 4px solid transparent; border-top-color: var(--soft); border-bottom: 0; }
.icogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; padding: 8px; background: var(--mint); border-radius: 14px; }
.icopick { width: 100%; max-width: 52px; aspect-ratio: 1; border-radius: 12px; border: 1.5px solid transparent; background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.icopick svg { width: 22px; height: 22px; }
.icopick.on { border-color: var(--primary); background: var(--peach-tint); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.toast[hidden] { display: none; }
.pubbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
</style>
</head>
<body>
<div class="wrap"><div id="view"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {

  };
  var ICON_NAMES = { dumbbell: '啞鈴', drop: '水滴', leaf: '葉子', moon: '月亮', shoe: '腳步', bowl: '餐碗', sun: '太陽', heart: '愛心', stretch: '伸展', star: '星星', gift: '禮物', spark: '閃光', flag: '旗子', trophy: '獎盃', ticket: '票券', flame: '火焰', tree: '聖誕樹' };
  var KINDS = { habit_once: '活動期間完成指定習慣（一次）', workout_days: '活動期間累計運動天數', workout_streak: '活動期間連續運動天數', full_days: '活動期間「全部完成」的天數' };
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  /* 與會員版目前內建的設定相同（第 2 版） */
  function defaults() {
    return {
      rulesEffectiveFrom: '',
      period: { start: '2026-12-01', end: '2027-02-28' },
      ticketCost: 20,
      habits: JSON.parse(JSON.stringify(HABIT_DEFAULTS)),
      levels: [{ name: '初心女神', min: 0 }, { name: '習慣女神', min: 50 }, { name: '自律女神', min: 100 }, { name: '力量女神', min: 150 }, { name: '閃耀女神', min: 200 }, { name: '自信女神', min: 300 }, { name: '窈窕女神', min: 400 }, { name: '完美女神', min: 500 }, { name: '自由女神🗽', min: 600 }, { name: '女神降臨✨', min: 700 }],
      rules: {
        perHabit: 1, allDayBonus: 3,
        weekWorkout: { days: 3, points: 5 },
        weekConsistent: { days: 5, perDayMin: 3, points: 3 },
        weekMission: { points: 5, missions: [
          { title: '本週 5 天喝足水', habitId: 'h-water', days: 5 }, { title: '本週 5 天睡滿 7 小時', habitId: 'h-sleep', days: 5 }, { title: '本週 5 天蛋白質吃夠', habitId: 'h-protein', days: 5 }
        ] },
        streak: { len: 7, perDayMin: 3, points: 5 }
      },
      events: [
        { id: 'evt-xmas', name: '聖誕節健康日', desc: '12/24-25 完成運動，送給自己的聖誕禮物。', icon: 'tree', start: '2026-12-24', end: '2026-12-25', kind: 'habit_once', habitId: 'h-train', target: 1, points: 3, enabled: true },
        { id: 'evt-newyear', name: '元旦連續運動', desc: '1/1來運動，開年第一份力量。', icon: 'flame', start: '2027-01-01', end: '2027-01-01', kind: 'habit_once', habitId: 'h-train', target: 1, points: 5, enabled: true },
        { id: 'evt-cny', name: '農曆新年健康任務', desc: '2/10-13 開工大吉，輕鬆照顧自己。', icon: 'gift', start: '2027-02-10', end: '2027-02-13', kind: 'habit_once', habitId: 'h-train', target: 1, points: 3, enabled: true },
        { id: 'evt-boost', name: '運動次數加碼（範例）', desc: '1/15–1/31 累計運動 8 天加碼。', icon: 'trophy', start: '2027-01-15', end: '2027-01-31', kind: 'workout_days', habitId: 'h-train', target: 8, points: 5, enabled: false }
      ]
    };
  }
  var A = { draft: defaults(), published: 2 };
  var memOnly = false;
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try { var t = localStorage.getItem(KEY); if (t) { var o = JSON.parse(t); if (o && o.draft && o.draft.rules) { A = { draft: o.draft, published: parseInt(o.published, 10) || 1 }; if (!Array.isArray(A.draft.habits) || A.draft.habits.length !== 5) A.draft.habits = JSON.parse(JSON.stringify(HABIT_DEFAULTS)); } } } catch (e) { memOnly = true; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) { memOnly = true; } }
  load();
  var U = { iconHab: null, confirm: null, iconEv: null, copied: '', importText: '', importError: '', out: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function svg(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[k] || ICONS.star) + '</svg>'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function sd(k) { var p = k.split('-'); return parseInt(p[1], 10) + '/' + parseInt(p[2], 10); }
  var toastTimer;
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }

  /* ---------- 檢查與輸出 ---------- */
  function hasHabit(id) { return habitsOf().some(function (h) { return h.id === id; }); }
  function validate() {
    var d = A.draft, errs = [], warns = [], r = d.rules, i;
    if (!DATE_RE.test(d.period.start) || !DATE_RE.test(d.period.end) || d.period.start > d.period.end) errs.push('活動期間的開始日期必須早於或等於結束日期。');
    habitsOf().forEach(function (h, k) { if (!String(h.name).trim()) errs.push('第 ' + (k + 1) + ' 個好習慣的名稱不能空白。'); });
    if (!(d.ticketCost >= 1)) errs.push('抽獎券兌換積分至少要 1。');
    if (d.rulesEffectiveFrom && !DATE_RE.test(d.rulesEffectiveFrom)) errs.push('規則生效日格式不正確。');
    if (!d.levels.length) errs.push('至少需要一個等級。');
    d.levels.forEach(function (l, k) {
      if (!l.name.trim()) errs.push('第 ' + (k + 1) + ' 級沒有名稱。');
      if (k > 0 && !(l.min > d.levels[k - 1].min)) errs.push('第 ' + (k + 1) + ' 級的累積積分必須大於上一級。');
    });
    if (d.levels.length && d.levels[0].min !== 0) errs.push('第 1 級的累積積分必須是 0。');
    if (r.weekWorkout.days < 1 || r.weekWorkout.days > 7) errs.push('每週運動日需在 1–7 之間。');
    if (r.weekConsistent.days < 1 || r.weekConsistent.days > 7) errs.push('每週穩定達標的天數需在 1–7 之間。');
    if (r.weekConsistent.perDayMin < 1 || r.streak.perDayMin < 1) errs.push('「每天幾項」至少要 1。');
    if (r.weekConsistent.perDayMin > habitsOf().length || r.streak.perDayMin > habitsOf().length) warns.push('「每天幾項」比核心習慣數（' + habitsOf().length + '）還多，會員可能不容易達成。');
    if (r.streak.len < 1) errs.push('連續達標天數至少要 1。');
    r.weekMission.missions.forEach(function (m, k) {
      if (!m.title.trim()) errs.push('第 ' + (k + 1) + ' 個每週任務沒有名稱。');
      if (!hasHabit(m.habitId)) errs.push('第 ' + (k + 1) + ' 個每週任務的指定習慣不存在。');
      if (m.days < 1 || m.days > 7) errs.push('第 ' + (k + 1) + ' 個每週任務的天數需在 1–7 之間。');
    });
    if (!r.weekMission.missions.length) warns.push('沒有任何每週任務，每週任務獎勵將不會發放。');
    var ids = {};
    d.events.forEach(function (e, k) {
      var nm = '活動「' + (e.name || ('第 ' + (k + 1) + ' 個')) + '」';
      if (!e.name.trim()) errs.push('第 ' + (k + 1) + ' 個活動沒有名稱。');
      if (ids[e.id]) errs.push(nm + '的編號重複。'); ids[e.id] = 1;
      if (!DATE_RE.test(e.start) || !DATE_RE.test(e.end) || e.end < e.start) errs.push(nm + '的日期不正確。');

      if (e.enabled && (e.end < d.period.start || e.start > d.period.end)) warns.push(nm + '完全不在活動期間內，不會發分。');

    });
    return { errs: errs, warns: warns };
  }
  function buildOutput(version) {

    L.push('【每週】完成至少 ' + r.weekWorkout.days + ' 個運動日 +' + r.weekWorkout.points + '；至少 ' + r.weekConsistent.days + ' 天每天完成 ' + r.weekConsistent.perDayMin + ' 項以上 +' + r.weekConsistent.points + '；完成每週任務 +' + r.weekMission.points);

  /* ---------- 畫面 ---------- */

  function habitOpts(sel) { return habitsOf().map(function (h) { return '<option value="' + h.id + '"' + (h.id === sel ? ' selected' : '') + '>' + esc(h.name) + '</option>'; }).join(''); }
  function habitCard(hb, i) {
    var open = U.iconHab === i, d = 'data-hb="' + i + '"';
    var grid = open ? '<div class="icogrid" role="group" aria-label="選擇圖示">' + Object.keys(ICONS).map(function (k) { return '<button type="button" class="icopick' + (hb.icon === k ? ' on' : '') + '" data-act="hbicon" data-i="' + i + '" data-icon="' + k + '" aria-label="' + ICON_NAMES[k] + '">' + svg(k) + '</button>'; }).join('') + '</div>' : '';
    return '<div class="edit"><div class="line"><button type="button" class="icobtn" data-act="hbopen" data-i="' + i + '" aria-label="更換圖示">' + svg(hb.icon) + '</button><input type="text" ' + d + ' data-f="name" value="' + esc(hb.name) + '" maxlength="30" placeholder="習慣名稱" aria-label="習慣名稱"></div>' + grid +
      '<input type="text" ' + d + ' data-f="desc" value="' + esc(hb.desc) + '" maxlength="40" placeholder="說明（會員看得到）" aria-label="習慣說明">' + (hb.workout ? '<div class="small muted">這一項會被算成「運動」，影響每週運動日與運動活動。</div>' : '') + '</div>';
  }
  function eventCard(e, i) {
    var kindOpts = Object.keys(KINDS).map(function (k) { return '<option value="' + k + '"' + (e.kind === k ? ' selected' : '') + '>' + KINDS[k] + '</option>'; }).join('');
    var key = 'evdel:' + i, armed = U.confirm === key, d = 'data-ev="' + i + '"', open = U.iconEv === i;
    var grid = open ? '<div class="icogrid" role="group" aria-label="選擇圖示">' + Object.keys(ICONS).map(function (k) { return '<button type="button" class="icopick' + (e.icon === k ? ' on' : '') + '" data-act="evicon" data-i="' + i + '" data-icon="' + k + '" aria-label="' + ICON_NAMES[k] + '">' + svg(k) + '</button>'; }).join('') + '</div>' : '';
    return '<div class="edit' + (e.enabled ? '' : ' off') + '"><div class="line"><button type="button" class="icobtn" data-act="evopen" data-i="' + i + '" aria-label="更換圖示">' + svg(e.icon) + '</button><input type="text" ' + d + ' data-f="name" value="' + esc(e.name) + '" maxlength="30" placeholder="活動名稱" aria-label="活動名稱"></div>' + grid +
      '<input type="text" ' + d + ' data-f="desc" value="' + esc(e.desc) + '" maxlength="60" placeholder="活動說明（會員看得到）" aria-label="活動說明">' +
      '<div class="grid2"><label class="field">開始<input type="date" ' + d + ' data-f="start" value="' + esc(e.start) + '"></label><label class="field">結束<input type="date" ' + d + ' data-f="end" value="' + esc(e.end) + '"></label></div>' +
      '<label class="field">任務條件<select ' + d + ' data-f="kind">' + kindOpts + '</select></label>' +
      (e.kind === 'habit_once' ? '<label class="field">指定習慣<select ' + d + ' data-f="habitId">' + habitOpts(e.habitId) + '</select></label>' : '<label class="field">需要天數<input type="number" min="1" ' + d + ' data-f="target" value="' + e.target + '"></label>') +
      '<div class="grid2"><label class="field">獎勵積分<input type="number" min="0" ' + d + ' data-f="points" value="' + e.points + '"></label><div class="checks" style="align-self:end;padding-bottom:10px"><label><input type="checkbox" ' + d + ' data-f="enabled"' + (e.enabled ? ' checked' : '') + '>啟用</label></div></div>' +
      '<div class="row wrap-row"><span class="small muted">編號 ' + esc(e.id) + '</span><span class="grow"></span><button class="btn danger sm' + (armed ? ' armed' : '') + '" data-act="evdel" data-i="' + i + '">' + (armed ? '再按一次確認刪除' : '刪除活動') + '</button></div></div>';
  }
  function checksHtml(v) {
    return (v.errs.length ? '<ul class="errs">' + v.errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '<p class="b" style="color:var(--primary)">沒有錯誤，可以發佈。</p>') +
      (v.warns.length ? '<div class="small b" style="margin-top:10px">提醒</div><ul class="rules">' + v.warns.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '');
  }
  /* 輸入時只更新檢查區、公告文字與複製按鈕，不整頁重繪，避免吃掉使用者接著要點的按鈕 */
  function refreshChecks() {
    var v = validate(), c = document.getElementById('checks'), sm = document.getElementById('sum'), b = document.getElementById('copybtn');
    if (c) c.innerHTML = checksHtml(v);
    if (sm) sm.value = summaryText();
    if (b) b.disabled = v.errs.length > 0;
  }
  function render() {
    var d = A.draft, r = d.rules, v = validate(), next = A.published + 1;
    var h = '<div class="stack"><div class="top"><div class="eyebrow">教練專用</div><h1>女神養成所後台</h1></div>';
    h += '<div class="card note warn">這個頁面只給教練使用，請不要上傳到 GitHub 公開頁面。會員版看不到也改不了這些設定。' + (memOnly ? '<br><b>目前瀏覽器無法儲存草稿，重新整理後修改會消失。</b>' : '') + '</div>';
    h += '<div class="card"><div class="card-head"><h2>發佈說明</h2><span class="tagpill">下次發佈：第 ' + next + ' 版</span></div><ol class="rules"><li>在下方調整設定，最下面按「複製發佈設定」。</li><li>把複製的內容整段貼給 Claude，請 Claude 更新會員版並上架 GitHub。</li><li>會員下次打開網頁時自動套用：<b>已拿到的積分、活動獎勵、兌換紀錄都不會改變</b>；積分規則從隔天起生效。</li></ol></div>';
    h += '<div class="card"><div class="card-head"><h2>活動期間與兌換</h2></div><div class="grid2"><label class="field">開始<input type="date" data-p="period.start" value="' + esc(d.period.start) + '"></label><label class="field">結束<input type="date" data-p="period.end" value="' + esc(d.period.end) + '"></label>' +
      numField('ticketCost', d.ticketCost, '幾積分兌換 1 張抽獎券') + '<label class="field">規則生效日（留空＝會員更新後隔天）<input type="date" data-p="rulesEffectiveFrom" value="' + esc(d.rulesEffectiveFrom) + '"></label></div>' +
      '<p class="small muted" style="margin-top:8px">只有活動期間內的打卡會計分。規則生效日只能晚於「隔天」，不會回溯。</p></div>';
    h += '<div class="card"><div class="card-head"><h2>每日好習慣</h2><span class="small muted">5 個核心習慣</span></div><div class="stack" style="gap:10px">' + habitsOf().map(habitCard).join('') + '</div>' +
      '<p class="small muted" style="margin-top:8px">名稱、說明、圖示會員都看得到，但會員不能自己改。習慣數量與編號固定，積分規則和每週任務都靠編號對應，不會受影響。已經打卡的紀錄不會被改動。</p></div>';
    h += '<div class="card"><div class="card-head"><h2>積分規則</h2></div><div class="stack" style="gap:10px"><div class="grid2">' + numField('rules.perHabit', r.perHabit, '每完成 1 項習慣') + numField('rules.allDayBonus', r.allDayBonus, '當日全部完成加分') + '</div>' +
      '<div class="b small">每週運動日</div><div class="grid2">' + numField('rules.weekWorkout.days', r.weekWorkout.days, '至少幾個運動日') + numField('rules.weekWorkout.points', r.weekWorkout.points, '加分') + '</div>' +
      '<div class="b small">每週穩定達標</div><div class="grid3">' + numField('rules.weekConsistent.days', r.weekConsistent.days, '至少幾天') + numField('rules.weekConsistent.perDayMin', r.weekConsistent.perDayMin, '每天幾項') + numField('rules.weekConsistent.points', r.weekConsistent.points, '加分') + '</div>' +
      '<div class="b small">連續達標</div><div class="grid3">' + numField('rules.streak.len', r.streak.len, '連續幾天') + numField('rules.streak.perDayMin', r.streak.perDayMin, '每天幾項') + numField('rules.streak.points', r.streak.points, '加分') + '</div>' +
      '<div class="b small">每週指定任務（依週次輪流）</div>' + numField('rules.weekMission.points', r.weekMission.points, '完成任務加分') +
      r.weekMission.missions.map(function (m, i) {
        return '<div class="edit"><input type="text" data-ms="' + i + '" data-f="title" value="' + esc(m.title) + '" maxlength="40" placeholder="任務名稱" aria-label="任務名稱"><div class="grid2"><label class="field">指定習慣<select data-ms="' + i + '" data-f="habitId">' + habitOpts(m.habitId) + '</select></label><label class="field">需要天數<input type="number" min="1" max="7" data-ms="' + i + '" data-f="days" value="' + m.days + '"></label></div><div><button class="btn danger sm" data-act="msdel" data-i="' + i + '">移除此任務</button></div></div>';
      }).join('') + '<div><button class="btn ghost sm" data-act="msadd">新增任務</button></div></div>' +
      '<p class="small muted" style="margin-top:8px">習慣編號固定為 5 個核心習慣，名稱與圖示在上面的「每日好習慣」修改。已經開始的週，任務內容不會被改動。</p></div>';
    h += '<div class="card"><div class="card-head"><h2>女神等級</h2><span class="small muted">依累積積分</span></div><div class="stack" style="gap:10px">' + d.levels.map(function (l, i) {
      return '<div class="line"><span class="tagpill" style="min-width:3.4em;text-align:center">LV' + (i + 1) + '</span><input type="text" data-lv="' + i + '" data-f="name" value="' + esc(l.name) + '" maxlength="12" aria-label="等級名稱"><input type="number" min="0" data-lv="' + i + '" data-f="min" value="' + l.min + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="累積積分門檻" style="max-width:96px"></div>';
    }).join('') + '<div class="row wrap-row"><button class="btn ghost sm" data-act="lvadd">新增等級</button><button class="btn ghost sm" data-act="lvdel"' + (d.levels.length <= 1 ? ' disabled' : '') + '>移除最後一級</button></div></div></div>';
    h += '<div class="card"><div class="card-head"><h2>特殊活動</h2><span class="small muted">' + d.events.length + ' 個</span></div><div class="stack" style="gap:10px">' + d.events.map(eventCard).join('') + '</div><div style="margin-top:12px"><button class="btn ghost sm" data-act="evadd">新增活動</button></div>' +
      '<p class="small muted" style="margin-top:8px">已經有會員拿到的活動積分，不會因為修改或停用而被收回；會員拿到之後，該活動依「當時的條件」判斷。想讓大家重新領一次，請新增一個新活動（會產生新編號）。</p></div>';
    h += '<div class="card"><div class="card-head"><h2>發佈前檢查</h2></div><div id="checks">' + checksHtml(v) + '</div></div>';
    h += '<div class="card"><div class="card-head"><h2>公告文字</h2><button class="btn ghost sm" data-act="copysum">複製</button></div><textarea id="sum" readonly style="min-height:200px;font-family:var(--font);font-size:14px">' + esc(summaryText()) + '</textarea><p class="small muted" style="margin-top:6px">可以直接貼到 LINE 群組或貼文，跟會員說明目前規則。</p></div>';
    h += '<div class="card"><div class="card-head"><h2>發佈設定</h2><span class="tagpill">第 ' + next + ' 版</span></div><button class="btn" id="copybtn" data-act="copycfg"' + (v.errs.length ? ' disabled' : '') + '>複製發佈設定</button>' +
      (U.copied ? '<p class="small b" style="margin-top:8px;color:var(--primary)">' + esc(U.copied) + '</p>' : '') +
      (U.out ? '<label class="field" style="margin-top:10px" for="out">如果沒有自動複製，請全選後手動複製，貼給 Claude</label><textarea id="out" readonly>' + esc(U.out) + '</textarea>' : '') + '</div>';
    h += '<div class="card"><div class="card-head"><h2>載入既有設定</h2></div><p class="small muted" style="margin-bottom:8px">換裝置或想還原之前複製的發佈設定時，貼在這裡。</p><textarea id="imp" data-imp="1" placeholder="貼上發佈設定">' + esc(U.importText) + '</textarea>' +
      '<div class="row wrap-row" style="margin-top:10px"><button class="btn sm" data-act="impgo">載入</button><button class="btn danger sm' + (U.confirm === 'reset' ? ' armed' : '') + '" data-act="reset">' + (U.confirm === 'reset' ? '再按一次確認還原預設' : '還原成預設設定') + '</button></div>' +
      (U.importError ? '<p class="small" style="color:var(--warn);margin-top:8px">' + esc(U.importError) + '</p>' : '') + '</div></div>';
    document.getElementById('view').innerHTML = h;
  }
  var rendering = false, again = false;
  function draw() {
    if (rendering) { again = true; return; }
    rendering = true;
    try { var a = document.activeElement; if (a && a !== document.body && a.blur) { again = false; a.blur(); } render(); } finally { rendering = false; }
    if (again) { again = false; draw(); }
  }
  function arm(key, fn) { if (U.confirm === key) { U.confirm = null; fn(); return; } U.confirm = key; draw(); setTimeout(function () { if (U.confirm === key) { U.confirm = null; draw(); } }, 4000); }
  function copyText(text, fallbackId, done) {
    function fb() { var t = document.getElementById(fallbackId); if (t) { t.focus(); t.select(); } done(false); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fb); else fb(); } catch (e) { fb(); }
  }
  function setPath(obj, path, val) { var p = path.split('.'); for (var i = 0; i < p.length - 1; i++) obj = obj[p[i]]; obj[p[p.length - 1]] = val; }
  function uid() { return 'evt-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

  var actions = {
    msadd: function () { A.draft.rules.weekMission.missions.push({ title: '本週新任務', habitId: 'h-train', days: 5 }); save(); draw(); },
    msdel: function (el) { A.draft.rules.weekMission.missions.splice(parseInt(el.getAttribute('data-i'), 10), 1); save(); draw(); },
    lvadd: function () { var L = A.draft.levels, last = L[L.length - 1]; L.push({ name: '新等級', min: (last ? last.min : 0) + 100 }); save(); draw(); },
    lvdel: function () { if (A.draft.levels.length > 1) { A.draft.levels.pop(); save(); draw(); } },
    evadd: function () { A.draft.events.push({ id: uid(), name: '新活動', desc: '', icon: 'star', start: A.draft.period.start, end: A.draft.period.start, kind: 'habit_once', habitId: 'h-train', target: 1, points: 3, enabled: false }); save(); draw(); toast('已新增，設定好後記得勾選「啟用」'); },
    evdel: function (el) { var i = parseInt(el.getAttribute('data-i'), 10); arm('evdel:' + i, function () { A.draft.events.splice(i, 1); U.iconEv = null; save(); draw(); }); },
    hbopen: function (el) { var i = parseInt(el.getAttribute('data-i'), 10); U.iconHab = U.iconHab === i ? null : i; draw(); },
    hbicon: function (el) { habitsOf()[parseInt(el.getAttribute('data-i'), 10)].icon = el.getAttribute('data-icon'); U.iconHab = null; save(); draw(); },
    evopen: function (el) { var i = parseInt(el.getAttribute('data-i'), 10); U.iconEv = U.iconEv === i ? null : i; draw(); },
    evicon: function (el) { A.draft.events[parseInt(el.getAttribute('data-i'), 10)].icon = el.getAttribute('data-icon'); U.iconEv = null; save(); draw(); },
    copysum: function () { copyText(summaryText(), 'sum', function (ok) { toast(ok ? '已複製公告文字' : '請手動全選並複製'); }); },
    copycfg: function () {
      if (validate().errs.length) return;
      var version = A.published + 1, text = JSON.stringify(buildOutput(version), null, 2);
      A.published = version; save(); U.out = text;
      U.copied = '已產生第 ' + version + ' 版發佈設定，請貼給 Claude。';
      draw(); copyText(text, 'out', function (ok) { toast(ok ? '已複製第 ' + version + ' 版發佈設定' : '請手動全選並複製下方內容'); });
    },
    impgo: function () {
      var ta = document.getElementById('imp'); if (ta) U.importText = ta.value;
      var o; try { o = JSON.parse(U.importText); } catch (e) { U.importError = '這段內容不是有效的發佈設定。'; draw(); return; }
      if (!o || !o.period || !o.rules || !Array.isArray(o.levels) || !Array.isArray(o.events)) { U.importError = '發佈設定格式不符。'; draw(); return; }
      var base = defaults(), r = o.rules;
      A.draft = {
        rulesEffectiveFrom: DATE_RE.test(o.rulesEffectiveFrom) ? o.rulesEffectiveFrom : '',
        period: { start: o.period.start, end: o.period.end }, ticketCost: Math.max(1, parseInt(o.ticketCost, 10) || 30),
        habits: HABIT_DEFAULTS.map(function (d0) { var x = Array.isArray(o.habits) ? o.habits.filter(function (h) { return h && h.id === d0.id; })[0] : null; return x ? { id: d0.id, name: String(x.name || d0.name), desc: String(x.desc || ''), icon: ICONS[x.icon] ? x.icon : d0.icon, workout: d0.workout } : JSON.parse(JSON.stringify(d0)); }),
        levels: o.levels.map(function (l, i) { return { name: String(l.name || ''), min: i === 0 ? 0 : Number(l.min) || 0 }; }),
        rules: {
          perHabit: Number(r.perHabit), allDayBonus: Number(r.allDayBonus),
          weekWorkout: { days: Number(r.weekWorkout.days), points: Number(r.weekWorkout.points) },
          weekConsistent: { days: Number(r.weekConsistent.days), perDayMin: Number(r.weekConsistent.perDayMin), points: Number(r.weekConsistent.points) },
          weekMission: { points: Number(r.weekMission.points), missions: r.weekMission.missions.map(function (m) { return { title: String(m.title || ''), habitId: String(m.habitId), days: Number(m.days) }; }) },
          streak: { len: Number(r.streak.len), perDayMin: Number(r.streak.perDayMin), points: Number(r.streak.points) }
        },
        events: o.events.map(function (e) { return { id: String(e.id), name: String(e.name || ''), desc: String(e.desc || ''), icon: ICONS[e.icon] ? e.icon : 'star', start: e.start, end: e.end, kind: KINDS[e.kind] ? e.kind : 'habit_once', habitId: String(e.habitId || 'h-train'), target: Math.max(1, parseInt(e.target, 10) || 1), points: Number(e.points) || 0, enabled: !!e.enabled }; })
      };
      if (!A.draft.levels.length) A.draft.levels = base.levels;
      A.published = Math.max(1, parseInt(o.configVersion, 10) || 1);
      U.importText = ''; U.importError = ''; U.out = ''; U.copied = ''; save(); draw(); toast('已載入第 ' + A.published + ' 版設定');
    },
    reset: function () { arm('reset', function () { A = { draft: defaults(), published: 2 }; U.out = ''; U.copied = ''; save(); draw(); toast('已還原成預設設定'); }); }
  };
  document.addEventListener('click', function (e) { var el = e.target.closest('[data-act]'); if (!el || el.disabled) return; var fn = actions[el.getAttribute('data-act')]; if (fn) fn(el); });
  function numVal(t) { var v = parseFloat(t.value); return isNaN(v) ? 0 : Math.max(0, v); }
  document.addEventListener('input', function (e) {
    var t = e.target, p, i, f;
    if ((p = t.getAttribute('data-p')) != null) { if (t.type === 'number') setPath(A.draft, p, numVal(t)); else setPath(A.draft, p, t.value); save(); refreshChecks(); }
    else if ((i = t.getAttribute('data-ms')) != null) { f = t.getAttribute('data-f'); var m = A.draft.rules.weekMission.missions[parseInt(i, 10)]; if (f === 'title') m.title = t.value; else if (f === 'days') m.days = numVal(t); save(); refreshChecks(); }
    else if ((i = t.getAttribute('data-hb')) != null) { f = t.getAttribute('data-f'); habitsOf()[parseInt(i, 10)][f] = t.value; save(); refreshChecks(); }
    else if ((i = t.getAttribute('data-lv')) != null) { f = t.getAttribute('data-f'); var l = A.draft.levels[parseInt(i, 10)]; if (f === 'name') l.name = t.value; else l.min = numVal(t); save(); refreshChecks(); }
    else if ((i = t.getAttribute('data-ev')) != null) { f = t.getAttribute('data-f'); var ev = A.draft.events[parseInt(i, 10)]; if (f === 'name' || f === 'desc') ev[f] = t.value; else if (f === 'target' || f === 'points') ev[f] = numVal(t); save(); refreshChecks(); }
    else if (t.getAttribute('data-imp')) { U.importText = t.value; U.importError = ''; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, p, i, f;
    if ((p = t.getAttribute('data-p')) != null) { refreshChecks(); }
    else if ((i = t.getAttribute('data-ms')) != null) { if (t.getAttribute('data-f') === 'habitId') { A.draft.rules.weekMission.missions[parseInt(i, 10)].habitId = t.value; save(); } refreshChecks(); }
    else if ((i = t.getAttribute('data-lv')) != null) { refreshChecks(); }
    else if ((i = t.getAttribute('data-ev')) != null) {
      f = t.getAttribute('data-f'); var ev = A.draft.events[parseInt(i, 10)];
      if (f === 'enabled') { ev.enabled = t.checked; save(); draw(); }
      else if (f === 'kind') { ev.kind = t.value; save(); draw(); }
      else if (f === 'habitId') { ev.habitId = t.value; save(); refreshChecks(); }
      else if (f === 'start' || f === 'end') { if (t.value) ev[f] = t.value; if (ev.end < ev.start) { ev.end = ev.start; save(); draw(); } else { save(); refreshChecks(); } }
      else refreshChecks();
    }
  });
  draw();
})();
</script>
